[project]
name = "hrone-cua"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "openai>=2.0", "playwright>=1.50", "pydantic-settings>=2.7", "tzdata", "pillow", "av>=16", "python-multipart", "pyyaml", "browser-use==0.13.10"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
py-modules = ["main", "config"]
[tool.setuptools.packages.find]
include = ["models*", "services*", "tools*", "routers*"]
